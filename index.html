<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDW PrabhatTalk Alarm</title>
    <style>
        :root {
            --bg-night: #060913;
            --night-sky-gradient: linear-gradient(180deg, #060913 0%, #0f172a 70%, #17213f 100%);
            --surya-sunrise: #ff7722;
            --surya-glow: rgba(255, 119, 34, 0.5);
            --search-bg: #1e293b;
            --search-border: #334155;
            --chat-user-bg: #2563eb;
            --chat-ai-bg: #1e293b;
            --settings-bg: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: var(--bg-night);
            background: var(--night-sky-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            position: relative;
            overflow-x: hidden;
        }

        /* Astrologically multi-colored cosmic stars */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(#ffffff 1px, transparent 0),
                radial-gradient(#fbbf24 1.2px, transparent 0),
                radial-gradient(#38bdf8 1px, transparent 0);
            background-size: 60px 60px, 90px 90px, 120px 120px;
            background-position: 0 0, 30px 45px, 15px 70px;
            opacity: 0.2;
            pointer-events: none;
        }

        header {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0;
            z-index: 10;
        }

        .brand {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--text-main);
        }

        .brand span {
            color: var(--surya-sunrise);
        }

        .header-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1rem;
        }

        /* Settings Drawer Modal */
        .settings-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(6, 9, 19, 0.85);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .settings-content {
            background: var(--settings-bg);
            border: 1px solid rgba(255, 255, 255, 0.12);
            width: 100%;
            max-width: 420px;
            border-radius: 24px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }

        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--surya-sunrise);
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .setting-label {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .setting-select {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
        }

        .close-settings {
            background: var(--surya-sunrise);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        /* WhatsApp Style Chat History Container */
        .chat-container {
            width: 100%;
            max-width: 480px;
            flex: 1;
            background: rgba(15, 23, 42, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            margin: 10px 0;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 220px;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.4);
            z-index: 10;
        }

        .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .message.ai {
            background: var(--chat-ai-bg);
            color: var(--text-main);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .message.user {
            background: var(--chat-user-bg);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        main {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            z-index: 10;
        }

        /* Surya Sunrise Glowing Orb */
        .orb-container {
            position: relative;
            margin: 10px 0;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .orb {
            width: 90px;
            height: 90px;
            background: radial-gradient(circle at 30% 30%, #ffbe76, var(--surya-sunrise));
            border-radius: 50%;
            box-shadow: 0 0 30px var(--surya-glow), inset 0 0 15px rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease;
            user-select: none;
        }

        .orb.listening {
            animation: pulse-sunrise 1.5s infinite;
        }

        @keyframes pulse-sunrise {
            0% { transform: scale(1); box-shadow: 0 0 20px var(--surya-glow); }
            50% { transform: scale(1.08); box-shadow: 0 0 45px var(--surya-sunrise), 0 0 70px var(--surya-glow); }
            100% { transform: scale(1); box-shadow: 0 0 20px var(--surya-glow); }
        }

        .orb svg {
            width: 36px;
            height: 36px;
            fill: white;
        }

        .orb-instruction {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 6px;
            letter-spacing: 0.3px;
        }

        /* Psychologically Calming Search Bar */
        .input-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .text-input {
            flex: 1;
            background: var(--search-bg);
            border: 1px solid var(--search-border);
            padding: 12px 16px;
            border-radius: 16px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        .text-input::placeholder {
            color: var(--text-muted);
        }

        .send-btn {
            background: var(--surya-sunrise);
            color: white;
            border: none;
            padding: 0 18px;
            border-radius: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px var(--surya-glow);
        }

        footer {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-align: center;
            padding-top: 8px;
            z-index: 10;
        }
    </style>
</head>
<body onload="initApp()">

    <header>
        <div class="brand">PrabhatTalk <span>Alarm</span></div>
        <div class="header-controls">
            <button class="icon-btn" onclick="toggleSettings(true)" title="Settings">⚙️</button>
        </div>
    </header>

    <!-- Settings Modal Drawer -->
    <div class="settings-modal" id="settingsModal">
        <div class="settings-content">
            <div class="settings-header">
                <span>Settings & Preferences</span>
                <span style="cursor:pointer; font-size:1.2rem;" onclick="toggleSettings(false)">✕</span>
            </div>

            <div class="setting-group">
                <span class="setting-label">Language / भाषा / भाषा</span>
                <select id="langSelect" class="setting-select" onchange="updateLanguageSettings()">
                    <option value="en">English</option>
                    <option value="hi">हिंदी (Hindi)</option>
                    <option value="mr">मराठी (Marathi)</option>
                </select>
            </div>

            <div class="setting-group">
                <span class="setting-label">Voice Speech Speed (YouTube style)</span>
                <select id="speedSelect" class="setting-select">
                    <option value="0.75">0.75x (Slower & Calm)</option>
                    <option value="0.85" selected>1.0x (Normal Wise Tone)</option>
                    <option value="1.15">1.25x (Faster)</option>
                </select>
            </div>

            <div class="setting-group">
                <span class="setting-label">Timeline Format</span>
                <select id="timeFormatSelect" class="setting-select">
                    <option value="12">12-Hour Format (AM / PM)</option>
                    <option value="24">24-Hour Regional Format</option>
                </select>
            </div>

            <button class="close-settings" onclick="toggleSettings(false)">Save & Close</button>
        </div>
    </div>

    <!-- WhatsApp Style Message History Log -->
    <div class="chat-container" id="chatHistory"></div>

    <main>
        <div class="orb-container" id="orbBtn">
            <div class="orb" id="voiceOrb">
                <svg viewBox="0 0 24 24">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                </svg>
            </div>
        </div>
        <div class="orb-instruction" id="orbInstruction">Hold button / Tap orb to speak with your guide</div>

        <div class="input-container">
            <input type="text" id="userInput" class="text-input" placeholder="Type your morning purpose here..." onkeypress="checkEnter(event)">
            <button class="send-btn" onclick="handleUserResponse()">Send</button>
        </div>
    </main>

    <footer>
        Cosmic Discipline & Surya Energy • Gentle Voice Awakening
    </footer>

    <script>
        const translations = {
            en: {
                instruction: "Hold button / Tap orb to speak with your guide",
                placeholder: "Type your morning purpose or answer here...",
                greeting: "Welcome. Take a calm, deep breath. You are here to build discipline and shape your destiny. What makes tomorrow worth waking up for?",
                askFrequency: "Got it. Now, how many times should I call you or check in on you? (For example: 2 times, or every 15 minutes for jogging and water)."
            },
            hi: {
                instruction: "बोलने के लिए गोले को दबाकर रखें / टैप करें",
                placeholder: "यहाँ अपना सुबह का उद्देश्य या उत्तर लिखें...",
                greeting: "स्वागत है। एक गहरी और शांत सांस लें। आप अनुशासन और अपना भाग्य गढ़ने के लिए यहाँ हैं। कल सुबह जागने की सबसे खास वजह क्या है?",
                _askFrequency: "समझ गया। अब, मुझे आपको कितनी बार कॉल करना चाहिए या याद दिलाना चाहिए? (जैसे: 2 बार, या जॉगिंग और पानी के लिए हर 15 मिनट में)।"
            },
            mr: {
                instruction: "बोलण्यासाठी गोलावर दाबून ठेवा / टॅप करा",
                placeholder: "येथे तुमचे सकाळचे ध्येय लिहा...",
                greeting: "स्वागत आहे. एक दीर्घ आणि शांत श्वास घ्या. तुम्ही अनुशासन आणि तुमचे भविष्य घडवण्यासाठी येथे आहात. उद्या सकाळी उठण्याचे सर्वात सुंदर कारण काय आहे?",
                _askFrequency: "समजले. आता, मी तुम्हाला किती वेळा कॉल किंवा रिमाइंडर द्यावे? (उदा: 2 वेळा, किंवा व्यायाम आणि पाण्यासाठी दर 15 मिनिटांनी)."
            }
        };

        let conversationStage = 1; // 1: Waiting for purpose, 2: Waiting for frequency count

        function initApp() {
            const lang = document.getElementById('langSelect').value;
            appendMessage(translations[lang].greeting, 'ai');
            speakDeepVoice(translations[lang].greeting);
        }

        function toggleSettings(open) {
            document.getElementById('settingsModal').style.display = open ? 'flex' : 'none';
        }

        function updateLanguageSettings() {
            const lang = document.getElementById('langSelect').value;
            document.getElementById('orbInstruction').innerText = translations[lang].instruction;
            document.getElementById('userInput').placeholder = translations[lang].placeholder;
            appendMessage(translations[lang].greeting, 'ai');
            speakDeepVoice(translations[lang].greeting);
            conversationStage = 1;
        }

        function appendMessage(text, sender) {
            const chatHistory = document.getElementById('chatHistory');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.innerText = text;
            chatHistory.appendChild(msgDiv);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        // Deep mentor voice with YouTube style adjustable speed control
        function speakDeepVoice(text) {
            const lang = document.getElementById('langSelect').value;
            const speed = parseFloat(document.getElementById('speedSelect').value);
            
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang === 'hi' ? 'hi-IN' : (lang === 'mr' ? 'mr-IN' : 'en-US');
                utterance.rate = speed; // Controlled by settings
                utterance.pitch = 0.6; // Deep, serious tone
                window.speechSynthesis.speak(utterance);
            }
        }

        const orbBtn = document.getElementById('orbBtn');
        orbBtn.addEventListener('click', toggleListening);

        function toggleListening() {
            const lang = document.getElementById('langSelect').value;
            const orb = document.getElementById('voiceOrb');
            const instruction = document.getElementById('orbInstruction');
            
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                const recognition = new SpeechRecognition();
                recognition.lang = lang === 'hi' ? 'hi-IN' : (lang === 'mr' ? 'mr-IN' : 'en-US');
                
                recognition.onstart = () => {
                    orb.classList.add('listening');
                    instruction.innerText = "Listening...";
                };

                recognition.onresult = (event) => {
                    const transcript = event.results[0][0].transcript;
                    appendMessage(transcript, 'user');
                    orb.classList.remove('listening');
                    instruction.innerText = translations[lang].instruction;
                    
                    processAIResponse(transcript);
                };

                recognition.onerror = () => {
                    orb.classList.remove('listening');
                    instruction.innerText = translations[lang].instruction;
                };

                recognition.onend = () => {
                    orb.classList.remove('listening');
                    instruction.innerText = translations[lang].instruction;
                };

                recognition.start();
            } else {
                speakDeepVoice("Please type your response below.");
            }
        }

        function checkEnter(event) {
            if (event.key === 'Enter') {
                handleUserResponse();
            }
        }

        function handleUserResponse() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (text !== "") {
                appendMessage(text, 'user');
                input.value = "";
                processAIResponse(text);
            }
        }

        function processAIResponse(userText) {
            const lang = document.getElementById('langSelect').value;
            let reply = "";

            if (conversationStage === 1) {
                // After receiving wake up purpose, ask how many times to call
                reply = lang === 'hi' ? translations[lang]._askFrequency : (lang === 'mr' ? translations[lang]._askFrequency : translations[lang].askFrequency);
                conversationStage = 2;
            } else {
                // After receiving frequency count, lock in schedule
                reply = lang === 'hi' 
                    ? `उत्कृष्ट। आपकी टाइमिंग और लक्ष्य दर्ज हो गए हैं। समय होने पर मैं आपको जॉगिंग, पानी और दिन की शुरुआत के लिए गहरी आवाज़ में जगाऊंगा।` 
                    : (lang === 'mr' 
                        ? `उत्कृष्ट. तुमची वेळ आणि ध्येय नोंदवले गेले आहे. वेळ झाल्यावर मी तुम्हाला व्यायामासाठी आणि दिवसाच्या सुरुवातीसाठी जागे करेन.` 
                        : `Wonderful. Your schedule and frequency are locked in. I will call you gently at your requested intervals for jogging, hydration, and stepping into your day with full discipline.`);
                conversationStage = 1; // Reset for next cycle if needed
            }

            appendMessage(reply, 'ai');
            speakDeepVoice(reply);
        }
    </script>
</body>
</html>
