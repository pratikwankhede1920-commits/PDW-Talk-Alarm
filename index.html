<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ARUN</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#screen {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

#sunButton {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    outline: none;
    background: #000;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

#sunImage {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    object-position: center;
    pointer-events: none;
}

/* Hidden settings */

#settings {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 5;
    background: #050505;
    color: white;
    overflow-y: auto;
    padding: 25px;
    font-family: Arial, sans-serif;
}

#settings.open {
    display: block;
}

#settings h2 {
    font-weight: 400;
    margin: 25px 0;
}

#settings label {
    display: block;
    margin: 20px 0 8px;
    color: #d5b77c;
}

#settings input,
#settings select {
    width: 100%;
    padding: 13px;
    border: 1px solid #66502e;
    border-radius: 10px;
    background: #111;
    color: white;
    font-size: 16px;
}

#settings button {
    margin-top: 18px;
    padding: 13px 20px;
    border: 1px solid #c49a55;
    border-radius: 30px;
    background: #17110a;
    color: #f5ce88;
    font-size: 15px;
}

#alarmScreen {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 10;
    background: #000;
    color: #f5d9a5;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 25px;
}

#alarmScreen button {
    margin: 15px;
    padding: 14px 25px;
    border-radius: 30px;
    background: #17110a;
    color: #f5ce88;
    border: 1px solid #c49a55;
}
</style>
</head>

<body>

<div id="screen">

    <button id="sunButton" aria-label="ARUN">
        <img
            id="sunImage"
            src="sunrise.png"
            alt=""
            draggable="false"
        >
    </button>

</div>

<div id="settings">

    <h2>ARUN</h2>

    <label>Alarm Time</label>
    <input type="time" id="alarmTime" value="05:00">

    <label>Alarm Date</label>
    <input type="date" id="alarmDate">

    <label>Your Name (Optional)</label>
    <input type="text" id="userName" placeholder="Your name">

    <label>Language</label>
    <select id="language">
        <option value="en-IN">English</option>
        <option value="hi-IN">Hindi</option>
        <option value="mr-IN">Marathi</option>
    </select>

    <label>Voice</label>
    <select id="voice">
        <option value="any">Automatic</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
    </select>

    <label>Relationship Style</label>
    <select id="relationship">
        <option value="gentle">Gentle</option>
        <option value="mother">Motherly</option>
        <option value="father">Fatherly</option>
        <option value="coach">Discipline Coach</option>
        <option value="friend">Friendly</option>
    </select>

    <label>Speaking Speed</label>
    <input type="range" id="speed"
           min="0.7" max="1.3" step="0.05" value="0.9">

    <label>Sun Colour</label>
    <select id="sunTheme">
        <option value="sunrise">Solar Amber</option>
        <option value="gold">Antique Gold</option>
        <option value="rose">Rose Dawn</option>
        <option value="blue">Blue Sunrise</option>
    </select>

    <button onclick="saveAlarm()">Save Alarm</button>

    <button onclick="testAlarm(1)">1 Minute Test</button>

    <button onclick="testAlarm(5)">5 Minute Test</button>

    <button onclick="closeSettings()">Close</button>

</div>

<div id="alarmScreen">

    <div id="alarmMessage"></div>

    <button onclick="snoozeAlarm()">5 More Minutes</button>

    <button onclick="stopAlarm()">I'm Awake</button>

</div>

<script>

let alarmTimeout = null;
let ringing = false;
let reminderInterval = null;

const sunButton = document.getElementById("sunButton");
const settings = document.getElementById("settings");

let holdTimer;

sunButton.addEventListener("pointerdown", function() {
    holdTimer = setTimeout(openSettings, 650);
});

["pointerup", "pointerleave", "pointercancel"].forEach(event => {
    sunButton.addEventListener(event, function() {
        clearTimeout(holdTimer);
    });
});

function openSettings() {
    settings.classList.add("open");
}

function closeSettings() {
    settings.classList.remove("open");
}

function speak(message) {

    if (!("speechSynthesis" in window)) return;

    speechSynthesis.cancel();

    const speech = new SpeechSynthesisUtterance(message);

    speech.lang = document.getElementById("language").value;
    speech.rate = Number(document.getElementById("speed").value);

    const voices = speechSynthesis.getVoices();

    const language = speech.lang.substring(0, 2);

    let available = voices.filter(v =>
        v.lang.toLowerCase().startsWith(language)
    );

    const preference = document.getElementById("voice").value;

    if (preference !== "any") {
        const filtered = available.filter(v =>
            preference === "female"
                ? /female|woman|zira|heera|samantha/i.test(v.name)
                : /male|man|david|ravi|hemant/i.test(v.name)
        );

        if (filtered.length) available = filtered;
    }

    if (available.length) speech.voice = available[0];

    speechSynthesis.speak(speech);
}

function getWakeMessage() {

    const name = document.getElementById("userName").value.trim();
    const lang = document.getElementById("language").value;
    const style = document.getElementById("relationship").value;

    if (lang === "mr-IN") {
        if (style === "mother")
            return name
                ? `${name}, बाळा, उठायची वेळ झाली आहे. कृपया उठा.`
                : "बाळा, उठायची वेळ झाली आहे. कृपया उठा.";

        return name
            ? `${name}, शुभ सकाळ. उठायची वेळ झाली आहे.`
            : "शुभ सकाळ. उठायची वेळ झाली आहे.";
    }

    if (lang === "hi-IN") {
        if (style === "mother")
            return name
                ? `${name}, बेटा, उठने का समय हो गया है।`
                : "बेटा, उठने का समय हो गया है।";

        return name
            ? `${name}, सुप्रभात। उठने का समय हो गया है।`
            : "सुप्रभात। उठने का समय हो गया है।";
    }

    if (style === "mother")
        return name
            ? `${name}, sweetheart, it is time to wake up.`
            : "It is time to wake up, dear.";

    if (style === "coach")
        return "Wake up. Your time has arrived. Start your day with discipline.";

    if (style === "father")
        return name
            ? `${name}, good morning. It is time to get up.`
            : "Good morning. It is time to get up.";

    return name
        ? `Good morning, ${name}. Please wake up.`
        : "Good morning. Please wake up.";
}

function startAlarm() {

    if (ringing) return;

    ringing = true;

    document.getElementById("alarmScreen").style.display = "flex";

    document.getElementById("alarmMessage").textContent =
        getWakeMessage();

    speak(getWakeMessage());

    reminderInterval = setInterval(function() {

        if (ringing) {
            speak(getWakeMessage());
        }

    }, 12000);
}

function stopAlarm() {

    ringing = false;

    clearInterval(reminderInterval);

    speechSynthesis.cancel();

    document.getElementById("alarmScreen").style.display = "none";
}

function snoozeAlarm() {

    stopAlarm();

    setTimeout(startAlarm, 5 * 60 * 1000);

    speak(
        document.getElementById("language").value === "mr-IN"
        ? "ठीक आहे. पाच मिनिटांनी पुन्हा आठवण करून देईन."
        : document.getElementById("language").value === "hi-IN"
        ? "ठीक है। पाँच मिनट बाद फिर याद दिलाऊँगा।"
        : "Okay. I will remind you again in five minutes."
    );
}

function setAlarm(date) {

    clearTimeout(alarmTimeout);

    const delay = date.getTime() - Date.now();

    if (delay <= 0) return;

    alarmTimeout = setTimeout(startAlarm, delay);
}

function saveAlarm() {

    const time = document.getElementById("alarmTime").value;

    if (!time) return;

    const [hours, minutes] = time.split(":").map(Number);

    const dateInput = document.getElementById("alarmDate").value;

    const date = dateInput
        ? new Date(dateInput + "T" + time + ":00")
        : new Date();

    if (!dateInput) {
        date.setHours(hours, minutes, 0, 0);

        if (date <= new Date()) {
            date.setDate(date.getDate() + 1);
        }
    }

    setAlarm(date);

    closeSettings();
}

function testAlarm(minutes) {

    const date = new Date(
        Date.now() + minutes * 60 * 1000
    );

    setAlarm(date);

    closeSettings();
}

document.getElementById("sunTheme").onchange = function() {

    const themes = {
        sunrise: "sunrise.png",
        gold: "gold.png",
        rose: "rose.png",
        blue: "blue.png"
    };

    document.getElementById("sunImage").src =
        themes[this.value];
};

</script>

</body>
</html>
